name: Deploy hycoat-api to Azure App Service

on:
  workflow_run:
    workflows: ["CI - hycoat-ui and hycoat-api"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: hycoat-dev-api
  WORKING_DIRECTORY: hycoat-api
  PUBLISH_DIRECTORY: published
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.WORKING_DIRECTORY }}/hycoat-api.csproj

      - name: Publish
        run: dotnet publish ${{ env.WORKING_DIRECTORY }}/hycoat-api.csproj -c Release -o ${{ env.WORKING_DIRECTORY }}/${{ env.PUBLISH_DIRECTORY }} --no-restore /p:UseAppHost=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hycoat-api-published
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.PUBLISH_DIRECTORY }}
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: hycoat-dev-api

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hycoat-api-published
          path: published

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_HYCOAT_DEV_API }}
          package: published
